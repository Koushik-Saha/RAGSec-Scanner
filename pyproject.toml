[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ragsec-scanner"
version = "0.1.0"
description = "Security testing tool for retrieval-augmented generation (RAG) systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "chromadb",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "typer",
    "jinja2",
    "pydantic",
    "python-dotenv",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[project.scripts]
ragsec = "ragsec.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragsec = ["templates/*.j2", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: uses the real embedding model (downloads it on first run)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
